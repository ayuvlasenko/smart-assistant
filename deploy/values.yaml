server:
  image:
    repository: docker.bambom.org/smart-assistant-server
    tag: ""
    pullPolicy: IfNotPresent
  port: 3020
  replicas:
    preview: 1
    production:
      min: 2
      max: 4
      cpuAverageValue: "600m"
  revisionHistoryLimit: 1
  progressDeadlineSeconds: 300
  probes:
    startup:
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
  shutdown:
    preStopSeconds: 5
    closeGraceMilliseconds: 65000
    terminationGracePeriodSeconds: 75
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  secrets:
    base: server-secrets-base

ingress:
  domain: smart-assistant.bambom.org
  entryPoint: websecure
  certResolver: letsencrypt

service:
  port: 80

s3:
  ip: 192.168.0.182
  port: 9000
  bucket: smart-assistant
