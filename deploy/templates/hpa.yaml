{{- if eq .Values.resourceName "main" }}
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.0-standalone/horizontalpodautoscaler-autoscaling-v2.json
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-{{ .Values.resourceName }}
  labels:
    app: server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server-{{ .Values.resourceName }}
  minReplicas: {{ .Values.server.replicas.production.min }}
  maxReplicas: {{ .Values.server.replicas.production.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: {{ .Values.server.replicas.production.cpuAverageValue | quote }}
{{- end }}
