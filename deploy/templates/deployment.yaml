# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.0-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-{{ .Values.resourceName }}
  labels:
    app: server
spec:
  {{- if ne .Values.resourceName "main" }}
  replicas: {{ .Values.server.replicas.preview }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.server.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.server.progressDeadlineSeconds }}
  selector:
    matchLabels:
      app: server
      resourceName: {{ .Values.resourceName }}
  template:
    metadata:
      labels:
        app: server
        resourceName: {{ .Values.resourceName }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.server.shutdown.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: server
              resourceName: {{ .Values.resourceName }}
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          startupProbe:
            httpGet:
              path: /status
              port: {{ .Values.server.port }}
            {{- toYaml .Values.server.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /status
              port: {{ .Values.server.port }}
            {{- toYaml .Values.server.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.server.port }}
            {{- toYaml .Values.server.probes.liveness | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.server.shutdown.preStopSeconds }}
          env:
            - name: FASTIFY_CLOSE_GRACE_DELAY
              value: {{ .Values.server.shutdown.closeGraceMilliseconds | quote }}
            - name: RESOURCE_NAME
              value: {{ .Values.resourceName | quote }}
            - name: ENVIRONMENT
              value: {{ ternary "production" "preview" (eq .Values.resourceName "main") | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.server.secrets.base }}
            - secretRef:
                name: server-secrets-{{ .Values.branch }}
                optional: true
            {{- if ne .Values.resourceName .Values.branch }}
            - secretRef:
                name: server-secrets-{{ .Values.resourceName }}
                optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
