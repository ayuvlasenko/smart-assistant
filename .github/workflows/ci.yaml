# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-ayuvlasenko-smart-assistant-gen-a9f0f8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w server
      - run: npm run lint

  test:
    runs-on: arc-ayuvlasenko-smart-assistant-gen-a9f0f8
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      VALKEY_URL: ${{ secrets.TEST_VALKEY_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm test --workspaces

  build:
    needs: [lint, test]
    runs-on: arc-ayuvlasenko-smart-assistant-dind-a9f0f8
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BRANCH="${{ github.ref_name }}"
            SOURCE_SHA="${GITHUB_SHA}"
          fi
          BRANCH=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          SHORT_SHA=${SOURCE_SHA::7}
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}-${BRANCH}" >> $GITHUB_OUTPUT

      - name: Check if images exist
        id: check
        run: |
          REGISTRY="${{ vars.DOCKER_REGISTRY }}"
          SHORT_SHA="${{ steps.meta.outputs.short-sha }}"
          if docker manifest inspect $REGISTRY/smart-assistant-server:$SHORT_SHA &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Images for $SHORT_SHA already exist, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          files: docker-bake.hcl
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          SHORT_SHA: ${{ steps.meta.outputs.short-sha }}

      - name: Add branch tags
        run: |
          REGISTRY="${{ vars.DOCKER_REGISTRY }}"
          SHORT_SHA="${{ steps.meta.outputs.short-sha }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          docker buildx imagetools create \
            --tag $REGISTRY/smart-assistant-server:${SHORT_SHA}-${BRANCH} \
            $REGISTRY/smart-assistant-server:$SHORT_SHA
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      branch: ${{ steps.meta.outputs.branch }}

  migrate:
    needs: build
    runs-on: arc-ayuvlasenko-smart-assistant-gen-a9f0f8
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref != 'main')
    steps:
      - name: Install ArgoCD CLI
        run: |
          mkdir -p $HOME/.local/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARGOCD_ARCH="arm64"
          else
            ARGOCD_ARCH="amd64"
          fi
          curl -sSL -o $HOME/.local/bin/argocd https://s3.bambom.org/tools/argocd-linux-${ARGOCD_ARCH}
          chmod +x $HOME/.local/bin/argocd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Migrate
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          BRANCH="${{ needs.build.outputs.branch }}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RESOURCE_NAME="pr-${{ github.event.pull_request.number }}"
            TARGET_REVISION="${{ github.event.pull_request.head.ref }}"
            SYNC_REVISION="${{ github.event.pull_request.head.sha }}"

            PR_STATE=$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" | jq -r '.state')
            if [ "$PR_STATE" != "open" ]; then
              echo "PR #${{ github.event.pull_request.number }} is $PR_STATE, skipping migration."
              exit 0
            fi
          else
            RESOURCE_NAME="$BRANCH"
            TARGET_REVISION="${{ github.ref_name }}"
            SYNC_REVISION="$TARGET_REVISION"
          fi

          MIGRATION_APP_NAME="smart-assistant-$RESOURCE_NAME-migration"

          argocd app create "$MIGRATION_APP_NAME" \
            --upsert \
            --project default \
            --repo https://github.com/ayuvlasenko/smart-assistant.git \
            --path deploy/migration \
            --revision "$TARGET_REVISION" \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace smart-assistant \
            --grpc-web

          argocd app set "$MIGRATION_APP_NAME" \
            --revision "$TARGET_REVISION" \
            --helm-set server.image.tag="$IMAGE_TAG" \
            --helm-set resourceName="$RESOURCE_NAME" \
            --helm-set branch="$BRANCH" \
            --grpc-web

          argocd app sync "$MIGRATION_APP_NAME" --revision "$SYNC_REVISION" --grpc-web
          argocd app wait "$MIGRATION_APP_NAME" --timeout 300 --operation --sync --grpc-web

          echo "## Migration Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | $MIGRATION_APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $BRANCH |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [build, migrate]
    runs-on: arc-ayuvlasenko-smart-assistant-gen-a9f0f8
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref != 'main')
    steps:
      - name: Install ArgoCD CLI
        run: |
          mkdir -p $HOME/.local/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARGOCD_ARCH="arm64"
          else
            ARGOCD_ARCH="amd64"
          fi
          curl -sSL -o $HOME/.local/bin/argocd https://s3.bambom.org/tools/argocd-linux-${ARGOCD_ARCH}
          chmod +x $HOME/.local/bin/argocd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Deploy
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          BRANCH="${{ needs.build.outputs.branch }}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RESOURCE_NAME="pr-${{ github.event.pull_request.number }}"
            APP_NAME="smart-assistant-$RESOURCE_NAME"
            TARGET_REVISION="${{ github.event.pull_request.head.ref }}"
            SYNC_REVISION="${{ github.event.pull_request.head.sha }}"

            PR_STATE=$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" | jq -r '.state')
            if [ "$PR_STATE" != "open" ]; then
              echo "PR #${{ github.event.pull_request.number }} is $PR_STATE, skipping deploy."
              exit 0
            fi
          else
            RESOURCE_NAME="$BRANCH"
            APP_NAME="smart-assistant-$RESOURCE_NAME"
            TARGET_REVISION="${{ github.ref_name }}"
            SYNC_REVISION="$TARGET_REVISION"
          fi

          argocd app create "$APP_NAME" \
            --upsert \
            --project default \
            --repo https://github.com/ayuvlasenko/smart-assistant.git \
            --path deploy \
            --revision "$TARGET_REVISION" \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace smart-assistant \
            --grpc-web

          argocd app set "$APP_NAME" \
            --revision "$TARGET_REVISION" \
            --helm-set server.image.tag="$IMAGE_TAG" \
            --helm-set resourceName="$RESOURCE_NAME" \
            --helm-set branch="$BRANCH" \
            --grpc-web

          argocd app sync "$APP_NAME" --revision "$SYNC_REVISION" --grpc-web
          argocd app wait "$APP_NAME" --timeout 300 --health --grpc-web

          # Job summary
          if [ "$RESOURCE_NAME" == "main" ]; then
            URL="https://smart-assistant.bambom.org"
          else
            URL="https://${RESOURCE_NAME}.smart-assistant.bambom.org"
          fi

          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | $APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $BRANCH |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | $URL |" >> $GITHUB_STEP_SUMMARY
