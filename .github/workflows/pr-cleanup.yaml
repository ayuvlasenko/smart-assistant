# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: arc-ayuvlasenko-smart-assistant-gen-a9f0f8
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Install ArgoCD CLI
        run: |
          mkdir -p $HOME/.local/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARGOCD_ARCH="arm64"
          else
            ARGOCD_ARCH="amd64"
          fi
          curl -sSL -o $HOME/.local/bin/argocd https://s3.bambom.org/tools/argocd-linux-${ARGOCD_ARCH}
          chmod +x $HOME/.local/bin/argocd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Delete PR apps
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          app_listed() {
            local apps names
            apps=$(argocd app list -o json --grpc-web) || exit 1
            names=$(jq -r '(. // [])[].metadata.name' <<< "$apps") || exit 1
            grep -qxF "$1" <<< "$names"
          }

          for APP in "smart-assistant-pr-$PR_NUMBER" "smart-assistant-pr-$PR_NUMBER-migration"; do
            if ! app_listed "$APP"; then
              echo "$APP already gone, skipping."
              continue
            fi

            argocd app delete "$APP" --yes --grpc-web

            for _ in $(seq 60); do
              if ! app_listed "$APP"; then
                echo "$APP deleted."
                continue 2
              fi
              sleep 5
            done

            echo "$APP still exists after 5 minutes." >&2
            exit 1
          done
